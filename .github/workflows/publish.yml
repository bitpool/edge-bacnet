name: Publish to npm

# Publishes @bitpoolos/edge-bacnet to https://registry.npmjs.org.
#
# The mechanics live in bitpool/workflows so every @bitpoolos package shares one
# copy — see that repo's README for the inputs and caller requirements.
#
# Pushes to main are safe: the reusable workflow checks npm for the version in
# package.json first, so only a version bump actually publishes.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate + npm publish --dry-run only (no publish/tag/release)"
        type: boolean
        default: false

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    # workflows-public, not workflows: a reusable workflow in a private repo
    # cannot be called from a public one — the run fails at startup with no
    # jobs and no logs.
    uses: bitpool/workflows-public/.github/workflows/npm-publish.yml@v1
    # The org sets default_workflow_permissions: read, so these must be granted
    # here or the run dies as startup_failure with no logs at all.
    permissions:
      contents: write # tag + release
      id-token: write # provenance
    with:
      provenance: true
      dry_run: ${{ inputs.dry_run || false }}
      # Preserves this repo's deployment branch policy, which the old
      # repo-local workflow got from its own `environment: release`. The stale
      # NPM_TOKEN that used to sit in this environment has been deleted, so the
      # org secret is what resolves — an environment secret would shadow it.
      environment: release
    # NPM_TOKEN is an org secret scoped to the npm repos.
    secrets: inherit
